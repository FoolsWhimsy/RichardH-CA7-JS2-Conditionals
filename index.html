<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="Richard Hsu" name="author">
    <title>Bear, Ninja, Hunter</title>
</head>
<body>
    <script type ="text/javascript">
        // Prompts user for name
        let name = prompt("Welcome to Bear, Ninja, Hunter! Please enter your name to get started:");

        // Sends alert using their name
        alert(`Hi ${name}! Let's Play!!`);

        // Provides them a choice and input before displaying the result in the console and the webpage.
        let choice = prompt("Who are you: Bear, Ninja, or Hunter?")
        console.log(`${name}, you picked ${choice}!`);
        document.write(`${name}, you picked ${choice}!<br>`);
        console.log(`The computer picked Bear!`);
        document.write(`The computer picked Bear!<br>`);


        // Displays the results in the console and the webpage.
        switch (choice) {
            case "Bear":
                console.log(`You Tied!!`);
                document.write(`You Tied!!<br>`);
                break;
            case "Ninja":
                console.log(`You Lose!!`);
                document.write(`You Lose!!<br>`);
                break
            case "Hunter":
                console.log(`You Win!!`);
                document.write(`You Win!!<br>`);
                break;
        }
    </script>
</body>
</html>
